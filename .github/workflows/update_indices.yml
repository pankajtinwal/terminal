name: Update Indian Stock Indices (Delta Cache)

on:
  schedule:
    # Mid-day market update: 1:00 PM IST (07:30 UTC), Mon-Fri
    - cron: '30 7 * * 1-5'
    # Post-market close update: 3:40 PM IST (10:10 UTC), Mon-Fri
    - cron: '10 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-indices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy

      - name: Execute Delta Ingestion & Synthesize Indices
        run: |
          python build_indices.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated index delta update [skip ci]"
            git push
          fi
